<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="用旋轉圓描繪台灣與22縣市輪廓，探索傅立葉級數。"><title>用圓畫出台灣 · Fourier Taiwan</title></head><body><main><header><small>FOURIER STUDY / 01</small><h1>旋轉的圓，能畫出<span id="regionTitle">台灣本島</span>嗎？</h1><p>每個圓是一個頻率；所有旋轉向量相加，就是地圖輪廓。</p><div class="region-picker"><label>選擇輪廓 <select id="region"><option value="taiwan">台灣本島</option></select></label></div><p id="regionNote"></p><div class="stage">N = <span id="stageCount">64</span></div></header><canvas aria-label="旋轉圓描繪台灣本島海岸線的動畫" role="img"></canvas><section><div class="error">輪廓 RMS 誤差 <strong id="error">—</strong></div><div class="formula">z(t) = ∑ cₙ eⁱⁿᵗ</div></section><p id="status" role="status">手動模式 · 或按「自動示範」逐步觀看</p><div class="steps" id="steps" aria-label="快速選擇圓的數量"></div><section><progress id="tourProgress" max="10" value="0" aria-label="自動示範進度"></progress></section><nav><button id="auto">▶ 自動示範</button><button id="play" aria-pressed="false">暫停</button><button id="restart">重新描繪</button><label>圓的數量 <input id="count" type="range" min="1" max="512" value="64"><output id="n">64</output></label><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label><label><input id="circles" type="checkbox" checked style="width:auto">顯示圓</label><button id="music" aria-pressed="true">♫ 音樂：開</button><label>音量 <input id="volume" type="range" min="0" max="100" value="75"></label></nav><div class="music-controls"><button id="listen">▶ 試聽配樂</button><label class="upload">換自己的歌曲 <input id="audioFile" type="file" accept="audio/*"></label><button id="defaultMusic">恢復預設配樂</button></div><p style="text-align:center" id="audioNote">配樂：海岸漫步 · 鋼琴、和弦、貝斯與輕鼓點；可獨立試聽。</p><footer>本島輪廓 · <a href="https://www.naturalearthdata.com/">Natural Earth</a> 1:10m 概化海岸線<br>縣市界線 · <a href="https://data.gov.tw/dataset/7442">內政部國土測繪中心</a> COUNTY_MOI_1090820（2020-08-20），政府資料開放授權條款第 1 版；經簡化為動畫外輪廓。<br>誤差為重建點相對原取樣點的均方根距離 ÷ 所選輪廓南北高度，非測繪精度。</footer></main>
<script type="module" src="/src/main.js"></script></body></html>
